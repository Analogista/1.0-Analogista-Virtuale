name: Build Apps

on:
  workflow_dispatch:

env:
  GEMINI_API_KEY: offline-placeholder

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Dipendenze
        run: |
          npm install
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Modulo offline
        run: |
          mkdir -p src/utils
          cat > src/utils/offline.ts << 'EOF'
          export const isCapacitor = () => !!(window as any).Capacitor;
          export const isElectron = () => navigator.userAgent.toLowerCase().includes('electron');
          export const isOfflinePlatform = () => isCapacitor() || isElectron();
          export const getLocalNDA = () => localStorage.getItem('NDA_ACCEPTED') === 'true';
          export const setLocalNDA = () => localStorage.setItem('NDA_ACCEPTED', 'true');
          EOF

      - name: AuthGate con accesso locale
        run: |
          cat > src/components/AuthGate.tsx << 'EOF'
          import React, { useState } from 'react';
          import { useAuth } from '../contexts/AuthContext';
          import { getLocalNDA, setLocalNDA } from '../utils/offline';
          import { ShieldCheck, Loader2, LogIn } from 'lucide-react';
          export const AuthGate: React.FC<{ children: React.ReactNode }> = ({ children }) => {
            const { user, loading, loginWithGoogle, error, clearError } = useAuth();
            const [nda, setNda] = useState(getLocalNDA());
            const [checked, setChecked] = useState(false);
            if (loading) return (<div className="min-h-screen flex items-center justify-center bg-slate-50"><Loader2 className="w-10 h-10 animate-spin text-blue-600" /></div>);
            if (!user) return (
              <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50 p-6">
                <div className="max-w-md w-full bg-white rounded-2xl shadow-2xl p-8 text-center">
                  <h1 className="text-2xl font-bold text-gray-800 mb-2">Accesso Riservato</h1>
                  <p className="text-sm text-gray-500 mb-6">I tuoi dati saranno trattati con la massima riservatezza.</p>
                  {error && <p className="text-red-600 text-sm mb-4">{error}</p>}
                  <button onClick={() => { clearError(); loginWithGoogle(); }} className="w-full flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition">
                    <LogIn className="w-5 h-5" /> Accedi con Google
                  </button>
                </div>
              </div>
            );
            if (!nda) return (
              <div className="min-h-screen flex items-center justify-center bg-slate-50 p-6">
                <div className="max-w-md w-full bg-white rounded-2xl shadow-2xl p-8">
                  <ShieldCheck className="w-10 h-10 text-blue-600 mx-auto mb-4" />
                  <h2 className="text-xl font-bold text-center mb-4">Accordo di Riservatezza (NDA)</h2>
                  <div className="text-xs text-gray-600 bg-slate-100 rounded-lg p-4 h-40 overflow-y-auto mb-4">
                    <p>Il presente strumento e fornito cosi com'e per finalita di intrattenimento e approfondimento personale. Non costituisce dispositivo medico ne fornisce diagnosi. L'utilizzatore si impegna a non diffondere contenuti, esiti o metodologie. I dati trattati restano sotto la responsabilita dell'operatore.</p>
                  </div>
                  <label className="flex items-start gap-2 text-sm mb-4">
                    <input type="checkbox" checked={checked} onChange={(e) => setChecked(e.target.checked)} className="mt-1" />
                    Ho letto e accetto integralmente l'accordo di riservatezza.
                  </label>
                  <button disabled={!checked} onClick={() => { setLocalNDA(); setNda(true); }} className="w-full bg-blue-600 disabled:bg-gray-300 text-white font-semibold py-3 rounded-xl transition">
                    Firma e Accetta
                  </button>
                </div>
              </div>
            );
            return <>{children}</>;
          };
          EOF

      - name: Patch AuthContext (utente locale)
        run: |
          cat > patch.cjs << 'EOF'
          const fs = require('fs');
          const p = 'src/contexts/AuthContext.tsx';
          let s = fs.readFileSync(p, 'utf8');
          if (!s.includes('isOfflinePlatform')) {
            s = s.replace("import { auth, googleProvider } from '../services/firebase';",
              "import { auth, googleProvider } from '../services/firebase';\nimport { isOfflinePlatform } from '../utils/offline';");
            s = s.replace("useEffect(() => {",
              "useEffect(() => {\n    if (isOfflinePlatform()) { setUser({ uid: 'local-operator', email: 'operatore@locale.app', displayName: 'Operatore Locale' } as User); setLoading(false); return; }");
            fs.writeFileSync(p, s);
            console.log('AuthContext patched');
          }
          EOF
          node patch.cjs

      - name: Config Capacitor
        run: |
          cat > capacitor.config.ts << 'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig = {
            appId: 'com.pacommunication.analogista',
            appName: 'Analogista Virtuale',
            webDir: 'dist',
            server: { androidScheme: 'https' }
          };
          export default config;
          EOF

      - name: Build web
        run: npx vite build

      - name: Piattaforma Android
        run: npx cap add android

      - name: Permessi camera e microfono
        run: |
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n</manifest>#' android/app/src/main/AndroidManifest.xml

      - name: Compila APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Pubblica APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Dipendenze
        run: |
          npm install
          npm install -D electron@33 electron-builder@25

      - name: Build web
        run: npx vite build

      - name: Prepara Electron
        shell: bash
        run: |
          mkdir -p electron dist-electron
          cat > electron/main.cjs << 'EOF'
          const { app, BrowserWindow, session } = require('electron');
          const path = require('path');
          const express = require('express');
          function startStaticServer() {
            return new Promise((resolve) => {
              const srv = express();
              const dist = path.join(__dirname, '..', 'dist');
              srv.use(express.static(dist));
              srv.get('*', (_q, res) => res.sendFile(path.join(dist, 'index.html')));
              const s = srv.listen(0, '127.0.0.1', () => resolve(s.address().port));
            });
          }
          async function main() {
            const port = await startStaticServer();
            session.defaultSession.setPermissionRequestHandler((_wc, permission, cb) => {
              cb(['media', 'camera', 'microphone', 'audioCapture', 'videoCapture', 'mediaKeySystem'].includes(permission));
            });
            const win = new BrowserWindow({ width: 1100, height: 800, title: 'Analogista Virtuale di Max Pisani', autoHideMenuBar: true });
            win.loadURL(`http://127.0.0.1:${port}`);
          }
          app.whenReady().then(main);
          app.on('window-all-closed', () => app.quit());
          EOF
          cat > electron-builder.yml << 'EOF'
          appId: com.pacommunication.analogista
          productName: Analogista Virtuale
          directories:
            output: release
          files:
            - dist/**/*
            - dist-electron/**/*
            - package.json
          win:
            target: nsis
          EOF
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.main='dist-electron/main.cjs';fs.writeFileSync('package.json',JSON.stringify(p,null,2))"
          npx esbuild electron/main.cjs --bundle --platform=node --outfile=dist-electron/main.cjs --external:electron

      - name: Compila installer Windows
        run: npx electron-builder --win --publish never

      - name: Pubblica installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: release/*.exe
