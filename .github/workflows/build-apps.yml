name: Build Apps

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Dipendenze
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund || npm install --legacy-peer-deps --no-audit --no-fund
          npm install --legacy-peer-deps --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor-community/text-to-speech@5

      - name: Patch AuthContext (utente locale automatico)
        run: |
          cat > patch.cjs << 'EOF'
          const fs = require('fs');
          const p = 'src/contexts/AuthContext.tsx';
          if (!fs.existsSync(p) || !fs.existsSync('src/utils/offline.ts')) { console.log('skip patch'); process.exit(0); }
          let s = fs.readFileSync(p, 'utf8');
          if (!s.includes('isOfflinePlatform')) {
            s = s.replace("import { auth, googleProvider } from '../services/firebase';",
              "import { auth, googleProvider } from '../services/firebase';\nimport { isOfflinePlatform } from '../utils/offline';");
            s = s.replace("useEffect(() => {",
              "useEffect(() => {\n    if (isOfflinePlatform()) { setUser({ uid: 'local-operator', email: 'operatore@locale.app', displayName: 'Operatore Locale' } as User); setLoading(false); return; }");
            fs.writeFileSync(p, s);
            console.log('AuthContext patched');
          }
          EOF
          node patch.cjs

      - name: Config Capacitor
        run: |
          cat > capacitor.config.ts << 'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig = {
            appId: 'com.pacommunication.analogista',
            appName: 'Analogista Virtuale',
            webDir: 'dist',
            server: { androidScheme: 'https' }
          };
          export default config;
          EOF

      - name: Build web
        run: npx vite build

      - name: Piattaforma Android
        run: npx cap add android

      - name: Permessi camera e microfono
        run: |
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n</manifest>#' android/app/src/main/AndroidManifest.xml

      - name: Patch MainActivity (grant webcam)
        run: |
          python3 << 'PYEOF'
          import glob, re
          JAVA = """package %PKG%;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onStart() {
              super.onStart();
              if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA)
                    != PackageManager.PERMISSION_GRANTED) {
                ActivityCompat.requestPermissions(this,
                        new String[]{Manifest.permission.CAMERA, Manifest.permission.RECORD_AUDIO}, 1001);
              }
              getBridge().getWebView().setWebChromeClient(new WebChromeClient() {
                @Override
                public void onPermissionRequest(final PermissionRequest request) {
                  runOnUiThread(() -> request.grant(request.getResources()));
                }
              });
            }
          }
          """
          for mj in glob.glob('android/app/src/main/java/**/MainActivity.java', recursive=True):
              src = open(mj, encoding='utf-8').read()
              m = re.search(r'package\s+([\w.]+);', src)
              if m:
                  open(mj, 'w', encoding='utf-8').write(JAVA.replace('%PKG%', m.group(1)))
                  print('Patched', mj)
          PYEOF

      - name: Licenze Android
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Compila APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Pubblica APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk

  pages:
    runs-on: ubuntu-latest
    needs: []
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dipendenze
        run: npm ci --legacy-peer-deps --no-audit --no-fund || npm install --legacy-peer-deps --no-audit --no-fund
      - name: Patch AuthContext (utente locale automatico)
        run: |
          cat > patch.cjs << 'EOF'
          const fs = require('fs');
          const p = 'src/contexts/AuthContext.tsx';
          if (!fs.existsSync(p) || !fs.existsSync('src/utils/offline.ts')) { console.log('skip patch'); process.exit(0); }
          let s = fs.readFileSync(p, 'utf8');
          if (!s.includes('isOfflinePlatform')) {
            s = s.replace("import { auth, googleProvider } from '../services/firebase';",
              "import { auth, googleProvider } from '../services/firebase';\nimport { isOfflinePlatform } from '../utils/offline';");
            s = s.replace("useEffect(() => {",
              "useEffect(() => {\n    if (isOfflinePlatform()) { setUser({ uid: 'local-operator', email: 'operatore@locale.app', displayName: 'Operatore Locale' } as User); setLoading(false); return; }");
            fs.writeFileSync(p, s);
            console.log('AuthContext patched');
          }
          EOF
          node patch.cjs
      - name: Build web per Pages
        run: npx vite build --base=/${{ github.event.repository.name }}/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
